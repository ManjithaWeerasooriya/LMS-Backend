$kind: http-request
name: Schedule Live Class
method: POST
url: '{{baseUrl}}/api/v1/teacher/live-classes'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "courseId": "{{courseId}}",
      "title": "Live Class Title",
      "scheduledAt": "2025-01-01T10:00:00Z",
      "durationMinutes": 60,
      "meetingUrl": "https://meet.example.com/room"
    }

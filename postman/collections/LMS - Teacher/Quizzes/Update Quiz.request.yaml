name: Update Quiz
method: PUT
url: '{{baseUrl}}/api/v1/teacher/quizzes/{{quizId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Quiz 1",
      "description": "Updated quiz details",
      "durationMinutes": 45,
      "startTimeUtc": "2026-03-30T08:00:00Z",
      "endTimeUtc": "2026-03-30T11:00:00Z",
      "totalMarks": 100,
      "randomizeQuestions": true,
      "allowMultipleAttempts": true,
      "isPublished": true,
      "areResultsPublished": false
    }

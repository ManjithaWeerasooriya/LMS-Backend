$kind: http-request
name: Grade Answer
method: PUT
url: '{{baseUrl}}/api/v1/teacher/quizzes/{{quizId}}/attempts/{{attemptId}}/answers/{{answerId}}/grade'
order: 15000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "awardedMarks": 8.5,
      "teacherFeedback": "Clear answer with minor gaps."
    }

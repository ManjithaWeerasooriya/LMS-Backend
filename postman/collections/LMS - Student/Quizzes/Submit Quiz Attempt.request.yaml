$kind: http-request
name: Submit Quiz Attempt
method: POST
url: '{{baseUrl}}/api/v1/student/quizzes/attempts/{{attemptId}}/submit'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "answers": [
        {
          "questionId": "{{questionId}}",
          "selectedOptionIds": [
            "{{optionId}}"
          ]
        }
      ]
    }
